<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --cyan:#5ef2ff; --violet:#a77bff; --pink:#ff6ad5; --text:#eaf6ff; --dim:#9fb4cc; }
  html,body { margin:0; background:transparent; overflow:hidden; font:15px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
  #wrap { position:absolute; top:10px; right:10px; left:10px; display:flex; justify-content:flex-end; }
  #card { position:relative; max-width:100%; min-width:220px; box-sizing:border-box; padding:14px 18px 16px;
    border-radius:18px; background:linear-gradient(160deg, rgba(10,18,40,.86), rgba(22,10,44,.84));
    box-shadow:0 0 0 1px rgba(94,242,255,.35), 0 0 28px rgba(94,242,255,.25), 0 0 60px rgba(167,123,255,.22), 0 12px 40px rgba(0,0,0,.45);
    -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
    opacity:0; transform:translateY(-10px) scale(.97); filter:blur(6px); transition:none; overflow:hidden; }
  #card::before { content:""; position:absolute; inset:0; border-radius:18px; padding:1.5px; pointer-events:none;
    background:linear-gradient(120deg, var(--cyan), var(--violet), var(--pink), var(--cyan)); background-size:300% 300%;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    animation:edge 6s linear infinite; }
  #card::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.07;
    background:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px); }
  @keyframes edge { to { background-position:300% 0; } }
  #card.in { animation:appear .55s cubic-bezier(.2,.9,.25,1.15) forwards; }
  @keyframes appear { 0%{opacity:0;transform:translateY(-14px) scale(.96);filter:blur(8px)} 100%{opacity:1;transform:none;filter:blur(0)} }
  #card.out { animation:dissolve 1.3s ease-in forwards; }
  @keyframes dissolve {
    0%   { opacity:1; filter:blur(0) brightness(1); transform:none; -webkit-mask-image:linear-gradient(180deg,#000 100%,transparent 100%); }
    30%  { filter:blur(.5px) brightness(1.6); }
    100% { opacity:0; filter:blur(10px) brightness(2.2) hue-rotate(40deg); transform:translateY(-18px) scale(1.03); letter-spacing:.06em; }
  }
  #sweep { position:absolute; top:0; bottom:0; width:40%; left:-50%; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(94,242,255,.18), rgba(255,255,255,.28), rgba(167,123,255,.18), transparent); }
  #card.in #sweep { animation:sweep 1.1s .15s ease-out; }
  @keyframes sweep { to { left:120%; } }
  #head { display:flex; align-items:center; gap:8px; font:600 10.5px/1 "SF Mono", Menlo, monospace; letter-spacing:.22em;
    color:var(--cyan); text-transform:uppercase; margin-bottom:8px; text-shadow:0 0 10px rgba(94,242,255,.7); }
  #dot { width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; transform:scale(.7); } }
  #time { margin-left:auto; color:var(--dim); letter-spacing:.08em; text-shadow:none; }
  #body { max-height:calc(100vh - 90px); overflow:hidden; }
  .piece { animation:fadein .4s ease-out; }
  .piece + .piece { margin-top:8px; }
  @keyframes fadein { from { opacity:0; transform:translateY(4px); filter:blur(3px); } }
  .note { color:var(--dim); font-size:12.5px; font-style:italic; }
  p { margin:0 0 6px; } p:last-child { margin-bottom:0; }
  b, strong { color:#fff; text-shadow:0 0 12px rgba(94,242,255,.55); }
  code { font:12.5px "SF Mono", Menlo, monospace; background:rgba(94,242,255,.1); color:var(--cyan); padding:1px 5px; border-radius:5px; }
  ul { margin:4px 0 6px; padding-left:18px; } li { margin:2px 0; } li::marker { color:var(--violet); }
  table { border-collapse:collapse; margin:6px 0; font-size:13.5px; width:100%; }
  th { text-align:left; color:var(--violet); font-weight:600; border-bottom:1px solid rgba(167,123,255,.45); padding:4px 10px 4px 0; }
  td { border-bottom:1px solid rgba(255,255,255,.07); padding:4px 10px 4px 0; vertical-align:top; }
</style></head>
<body>
<div id="wrap"><div id="card"><div id="sweep"></div>
  <div id="head"><div id="dot"></div>Alfred<span id="time"></span></div>
  <div id="body"></div>
</div></div>
<script>
const card = document.getElementById('card'), body = document.getElementById('body');
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>'); }
function md(t){
  const lines = t.split('\n'); let out = [], i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if ((l.match(/\|/g)||[]).length >= 2) {
      const rows = []; while (i < lines.length && (lines[i].match(/\|/g)||[]).length >= 2) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
      const data = rows.filter(r => !/^\s*\|?[-:| ]+\|?\s*$/.test(r)).map(cells);
      if (data.length) { let h = '<table><tr>' + data[0].map(c => '<th>'+inline(c)+'</th>').join('') + '</tr>';
        data.slice(1).forEach(r => h += '<tr>' + r.map(c => '<td>'+inline(c)+'</td>').join('') + '</tr>'); out.push(h + '</table>'); }
      continue;
    }
    if (/^\s*([-*•]|\d+\.)\s+/.test(l)) {
      let h = '<ul>'; while (i < lines.length && /^\s*([-*•]|\d+\.)\s+/.test(lines[i])) { h += '<li>' + inline(lines[i].replace(/^\s*([-*•]|\d+\.)\s+/,'')) + '</li>'; i++; }
      out.push(h + '</ul>'); continue;
    }
    if (l.trim()) out.push('<p>' + inline(l.replace(/^#+\s*/,'')) + '</p>');
    i++;
  }
  return out.join('');
}
function reset(){ body.innerHTML=''; card.className=''; void card.offsetWidth; card.className='in';
  const d=new Date(); document.getElementById('time').textContent=d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function addText(kind, t){
  if (card.className !== 'in') reset();
  const div = document.createElement('div'); div.className = 'piece' + (kind === 'note' ? ' note' : '');
  div.innerHTML = kind === 'note' ? inline(t) : md(t); body.appendChild(div);
  while (body.scrollHeight > body.clientHeight + 2 && body.children.length > 1) body.removeChild(body.firstChild); // keep newest
}
function dissolve(){ card.className = 'out'; }
</script>
</body></html>
